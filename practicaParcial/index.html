<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería - Práctica Parcial</title>
    <!-- Hoja de estilos vinculada -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Script de lógica diferido -->
    <script defer src="js/main.js"></script>
</head>

<body>

    <!-- Encabezado superior verde -->
    <header class="header">
        <div class="header__item header__item--logo">
            <h1 class="header__titulo">Frutería</h1>
        </div>

        <div class="header__item header__item--autor">
            <p class="header__autor">Xabier</p>
        </div>

        <div class="header__item header__item--buscador">
            <form class="header__form" onsubmit="return false;">
                <div class="header__input-caja">
                    <input type="text" id="input-buscar" class="header__input" placeholder="Buscar...">
                </div>
            </form>
        </div>

        <div class="header__item header__item--carrito">
            <p id="header-carrito-contador" class="header__carrito-texto">Carrito: 0 productos</p>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="main">

        <!-- Sección de catálogo de frutas -->
        <section class="seccion-frutas">
            <div class="seccion-frutas__titulo-caja">
                <h2 class="seccion-titulo">Nuestras frutas</h2>
            </div>

            <!-- Grilla donde se inyectan las cards -->
            <div id="contenedor-frutas" class="frutas-grid">
                <!-- Generado dinámicamente desde main.js -->
            </div>
        </section>

        <!-- Sección de Carrito de compras -->
        <section class="seccion-carrito">
            <div class="seccion-carrito__titulo-caja">
                <h2 class="seccion-titulo">Carrito</h2>
            </div>

            <!-- Listado de frutas en el carrito -->
            <div id="contenedor-carrito-lista" class="carrito-lista">
                <!-- Items agregados se inyectan con JS -->
            </div>

            <!-- Total acumulado -->
            <div class="carrito-total">
                <p id="carrito-total-texto" class="carrito-total__texto">Total: $0</p>
            </div>
        </section>

    </main>

</body>
</html>
